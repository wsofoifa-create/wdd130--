<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->
         <table>
    <tr>
        <th>Speaker</th>
        <th>Title</th>
        <th>Location</th>
        <th>Year</th>
    </tr>
    <tr>
        <td>President Russell M. Nelson</td>
        <td>Think Celestial!</td>
        <td>BYU–Idaho / General Conference</td>
        <td>2023</td>
    </tr>
    <tr>
        <td>Elder Jeffrey R. Holland</td>
        <td>Like a Broken Vessel</td>
        <td>General Conference</td>
        <td>2013</td>
    </tr>
    <tr>
        <td>Elder Alexander Dushku</td>
        <td>Choose Christ</td>
        <td>LDS Devotional</td>
        <td>2026</td>
    </tr>
</table>
<h2>Add a Favorite Devotional</h2>

<form>
    <label for="speaker">Speaker:</label>
    <input type="text" id="speaker" name="speaker" placeholder="Enter speaker's name">

    <label for="title">Title:</label>
    <input type="text" id="title" name="title" placeholder="Enter devotional title">

    <label for="location">Location:</label>
    <input type="text" id="location" name="location" placeholder="Enter location">

    <label for="year">Year:</label>
    <input type="number" id="year" name="year" placeholder="Enter year">

    <button type="submit">Add Devotional</button>
</form>
      </div>
    </main>
  </div>
</body>
</html>
